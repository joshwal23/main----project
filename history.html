<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FitQuest - Workout History</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ff05a",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#111813] dark:text-white transition-colors duration-200">
    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside
            class="w-64 bg-white dark:bg-[#1a2e20] border-r border-[#dbe6df] dark:border-[#2d4033] flex flex-col fixed h-full">
            <div class="p-6">
                <a href="index.html" class="flex items-center gap-2 mb-8 hover:opacity-80 transition-opacity">
                    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-background-dark">fitness_center</span>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold leading-none">FitQuest</h1>
                        <p class="text-[#608a6e] text-xs font-medium">Squat Master</p>
                    </div>
                </a>
                <nav class="flex flex-col gap-2">
                    <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#608a6e] hover:bg-background-light dark:hover:bg-white/5 transition-colors"
                        href="dashboard.html">
                        <span class="material-symbols-outlined">dashboard</span>
                        <span class="text-sm font-medium">Dashboard</span>
                    </a>
                    <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/20 text-[#111813] dark:text-white"
                        href="history.html">
                        <span class="material-symbols-outlined fill-1">history</span>
                        <span class="text-sm font-medium">History</span>
                    </a>
                    <!--
                    <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#608a6e] hover:bg-background-light dark:hover:bg-white/5 transition-colors"
                        href="#">
                        <span class="material-symbols-outlined">emoji_events</span>
                        <span class="text-sm font-medium">Challenges</span>
                    </a>
                    -->
                    <div id="profile-btn"
                        class="flex flex-col gap-1 px-3 py-4 rounded-lg bg-background-light dark:bg-white/5 mt-4">
                        <div class="flex items-center gap-2">
                            <div
                                class="size-8 rounded-full bg-primary/20 flex items-center justify-center text-primary">
                                <span class="material-symbols-outlined text-sm">person</span>
                            </div>
                            <span id="sidebar-username" class="text-sm font-bold truncate">User</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-[#608a6e] font-bold uppercase">Total Reps</span>
                                <span id="sidebar-total-reps" class="text-xs font-black">0</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[10px] text-[#608a6e] font-bold uppercase">Sessions</span>
                                <span id="sidebar-total-sessions" class="text-xs font-black">0</span>
                            </div>
                        </div>
                    </div>
                    <button id="logout-btn"
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors mt-auto mb-4">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="text-sm font-medium">Logout</span>
                    </button>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8">
            <div class="max-w-5xl mx-auto">
                <!-- Header -->
                <header class="flex flex-wrap justify-between items-end gap-4 mb-8">
                    <div class="flex flex-col gap-1">
                        <h2 class="text-4xl font-black tracking-tight">Workout History</h2>
                        <p class="text-[#608a6e] text-lg font-normal">Review your previous sessions and progress</p>
                    </div>
                    <a href="trainer.html"
                        class="px-6 py-3 bg-primary text-background-dark font-bold rounded-xl flex items-center gap-2 shadow-lg shadow-primary/20 hover:brightness-110 transition-all">
                        <span class="material-symbols-outlined">add</span>
                        New Session
                    </a>
                </header>

                <!-- History Table -->
                <div
                    class="bg-white dark:bg-[#1a2e20] rounded-xl border border-[#dbe6df] dark:border-[#2d4033] overflow-hidden">
                    <div class="px-6 py-5 border-b border-[#dbe6df] dark:border-[#2d4033]">
                        <h3 class="text-lg font-bold">All Sessions</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-background-light/50 dark:bg-white/5">
                                <tr>
                                    <th class="px-6 py-3 text-xs font-bold text-[#608a6e] uppercase">Date & Time</th>
                                    <th class="px-6 py-3 text-xs font-bold text-[#608a6e] uppercase text-center">
                                        Duration</th>
                                    <th class="px-6 py-3 text-xs font-bold text-[#608a6e] uppercase text-center">Reps
                                    </th>
                                    <th class="px-6 py-3 text-xs font-bold text-[#608a6e] uppercase text-center">Avg
                                        Depth</th>
                                    <th class="px-6 py-3 text-xs font-bold text-[#608a6e] uppercase text-right">
                                        Intensity</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body" class="divide-y divide-[#dbe6df] dark:divide-[#2d4033]">
                                <!-- JavaScript will populate this -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/session.js"></script>
    <script src="js/history.js"></script>
</body>

</html>
